name: Product API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/product-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

  build-and-scan:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --pull --no-cache \
            -t clixx-product-api:${{ github.sha }} \
            services/product-api

      - name: Inspect setuptools in built image
        run: |
          docker run --rm clixx-product-api:${{ github.sha }} \
            python -m pip show setuptools

          docker run --rm clixx-product-api:${{ github.sha }} \
            python -c "import importlib.metadata as m; print([(d.metadata['Name'], d.version, str(d._path)) for d in m.distributions() if d.metadata['Name'].lower() == 'setuptools'])"

          docker run --rm clixx-product-api:${{ github.sha }} \
            sh -c 'find /usr/local/lib /usr/lib -iname "*setuptools*" 2>/dev/null'
      
      - name: Investigate setuptools vulnerability
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clixx-product-api:${{ github.sha }}
          format: json
          output: trivy-investigation.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload investigation report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-investigation
          path: trivy-investigation.json

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clixx-product-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'
