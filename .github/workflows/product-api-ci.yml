
name: Product API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/product-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

  build-and-scan:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_NAME: clixx-product-api:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --pull --no-cache \
            -t "$IMAGE_NAME" \
            services/product-api

      - name: Verify runtime image is hardened
        run: |
          docker run --rm "$IMAGE_NAME" python -c '
          import importlib.util
          import sys

          packages = ["pip", "setuptools", "wheel"]
          found = [
              package for package in packages
              if importlib.util.find_spec(package) is not None
          ]

          if found:
              print("FAIL: Unexpected runtime packaging tools:", found)
              sys.exit(1)

          print("PASS: Runtime packaging tools are absent")
          '

      - name: Verify application endpoints
        run: |
          docker run -d \
            --name product-api-ci \
            -p 127.0.0.1:8003:8000 \
            "$IMAGE_NAME"

          for attempt in $(seq 1 20); do
            if curl --fail --silent \
              http://127.0.0.1:8003/health/live; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              docker logs product-api-ci
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent --show-error \
            http://127.0.0.1:8003/products

      - name: Stop test container
        if: always()
        run: |
          docker rm -f product-api-ci || true

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: cyclonedx
          output: trivy-sbom.json
          exit-code: '0'

      - name: Upload image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom
          path: trivy-sbom.json
          if-no-files-found: error

      - name: Generate vulnerability investigation report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: json
          output: trivy-investigation.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload investigation report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-investigation
          path: trivy-investigation.json
          if-no-files-found: error

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'
